name: Build Release Binaries

on:
  release:
    types: [created]

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git tag detection
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"
      
      - name: Build all platforms
        run: make all
      
      - name: Convert Windows builds to ZIP
        run: |
          for tarfile in bin/sb_info-*-windows-*.tar.gz; do
            if [ -f "$tarfile" ]; then
              # Get the basename without .tar.gz and extract architecture
              basename="${tarfile%.tar.gz}"
              filename="${basename##*/}"
              
              # Extract the tar.gz
              tar -xzf "$tarfile"
              
              # Determine architecture from filename
              if [[ "$filename" == *"amd64"* ]]; then
                arch="amd64"
              elif [[ "$filename" == *"arm64"* ]]; then
                arch="arm64"
              fi
              
              # Create zip file with the exe
              cd bin/windows/$arch
              zip -j "../../${filename}.zip" sb_info.exe
              cd ../../..
              
              # Remove the Windows tar.gz files
              rm "$tarfile"
            fi
          done
      
      - name: List build artifacts
        run: |
          ls -lh bin/*.tar.gz 2>/dev/null || true
          ls -lh bin/*.zip 2>/dev/null || true
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/*.tar.gz
            bin/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            bin/*.tar.gz
            bin/*.zip
          retention-days: 30
